<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   
</head>
<body>
    <div class="Container">
        <div class="row"></div>
        <div class="col bg-primary text-white p-3">Column 1</div>

        <div class="col bg-danger text-white p-3">Column 3</div>
        <div class="col-4 bg-primary p-3">Column 4</div>
        <div class="col-4 bg-primary p-3">Column 5</div>
        
    <div style="background-color: aqua;">
        Fixed Width Container
    </div>
    <div style="background-color: rgb(80, 25, 218);">
        Full Width Container
    </div>
    <h1>Hello World</h1>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
